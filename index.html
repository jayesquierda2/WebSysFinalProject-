<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameDeck</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>GameDeck</h1>
        <div>Items: <span id="cart-count">0</span></div>
    </header>

    <main id="product-grid"></main>

    <section id="cart-container">
        <h2>Your Cart</h2>
        <div id="cart-list"></div>
        <p id="empty-text">Your cart is empty.</p>
        <div class="cart-summary">
            <strong>Total: $<span id="total-price">0</span></strong>
        </div>
        <button class="btn-checkout" onclick="checkout()">Checkout</button>
        <button class="btn-clear" onclick="emptyEverything()">Clear Cart</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
